name: Build

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}  # the newest Visual Studio on the runner
      - name: Build
        run: cmake --build build --config Release
      - name: Test the plug-in outside the audio engine
        if: matrix.arch == 'x64'
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.arch }}
          path: build/bin/*.*
